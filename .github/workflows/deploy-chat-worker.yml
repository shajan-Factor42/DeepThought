name: Deploy chat relay (Cloudflare Worker)

# Deploys chat-worker/ to Cloudflare whenever it changes. Needs three repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages → Account ID, right side)
#   ANTHROPIC_API_KEY      (console.anthropic.com → API Keys)
# Until they exist, the job skips instead of failing.

on:
  push:
    branches: [main]
    paths: ["chat-worker/**", ".github/workflows/deploy-chat-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CF" ] && [ -n "$ACC" ] && [ -n "$KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Chat relay not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY secrets."; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: chat-worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
