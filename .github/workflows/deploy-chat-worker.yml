name: Deploy chat relay (Cloudflare Worker)

# Deploys chat-worker/ to Cloudflare whenever it changes. Repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages → Account ID, right side)
#   ANTHROPIC_API_KEY      (console.anthropic.com → API Keys)
#   RESEND_API_KEY         (optional; resend.com → API Keys) turns on the daily chat digest email
# Until the first three exist, the job skips instead of failing.

on:
  push:
    branches: [main]
    paths: ["chat-worker/**", ".github/workflows/deploy-chat-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      KV_TITLE: deepthought-chat-log
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$ANTHROPIC_API_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Chat relay not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY secrets."; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "22"

      # The chat log lives in a Workers KV namespace. Create it once, then reuse it by title.
      - name: Find or create the chat log storage
        if: steps.check.outputs.ready == 'true'
        working-directory: chat-worker
        run: |
          set -e
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cf() { curl -sS -H "$auth" -H "Content-Type: application/json" "$@"; }
          # Plain-English checks first, so a bad token or account ID says so instead of failing later.
          acct=${CLOUDFLARE_ACCOUNT_ID//[[:space:]]/}
          v=$(cf "https://api.cloudflare.com/client/v4/user/tokens/verify")
          [ "$(echo "$v" | jq -r '.success')" = "true" ] || v=$(cf "https://api.cloudflare.com/client/v4/accounts/$acct/tokens/verify")
          if [ "$(echo "$v" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN: $(echo "$v" | jq -c '.errors'). Make a new token and paste it again."; exit 1; fi
          echo "Token OK (status: $(echo "$v" | jq -r '.result.status'))"
          api="https://api.cloudflare.com/client/v4/accounts/$acct/storage/kv/namespaces"
          list=$(cf "$api?per_page=100")
          if [ "$(echo "$list" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare said no to listing KV storage for account ID ending ...${acct: -4}: $(echo "$list" | jq -c '.errors'). Check the Account ID (Workers & Pages, right side) and that the token includes 'Workers KV Storage: Edit' for that account."; exit 1; fi
          id=$(echo "$list" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$id" ]; then
            made=$(cf -X POST -d "{\"title\":\"$KV_TITLE\"}" "$api")
            if [ "$(echo "$made" | jq -r '.success')" != "true" ]; then
              echo "::error::Cloudflare would not create the KV storage: $(echo "$made" | jq -c '.errors')"; exit 1; fi
            id=$(echo "$made" | jq -r '.result.id'); echo "Created KV namespace $KV_TITLE"
          fi
          sed -i "s/KV_ID_PLACEHOLDER/$id/" wrangler.toml

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: chat-worker
        run: |
          set -e
          # Pasted secrets sometimes carry a stray space or line break; wrangler rejects that.
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID//[[:space:]]/}" CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN//[[:space:]]/}"
          # Show wrangler's own error message on the run page if a step fails.
          run() { if ! "$@" > out.log 2>&1; then cat out.log; echo "::error::$(grep -E 'ERROR|\[ERROR\]|✘|error' out.log | head -3 | tr '\n' ' ' | cut -c1-600)"; exit 1; fi; cat out.log; }
          run npx --yes wrangler@4 deploy
          grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' out.log | head -1 | sed 's/^/::notice::Chat relay URL: /'
          printf '%s' "$ANTHROPIC_API_KEY" > key.txt; run sh -c 'npx --yes wrangler@4 secret put ANTHROPIC_API_KEY < key.txt'; rm -f key.txt
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
          else
            echo "::notice::RESEND_API_KEY not set: chats are logged, but the daily digest email is off."
          fi
