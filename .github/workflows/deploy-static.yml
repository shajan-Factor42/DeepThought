name: Deploy site (static render)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# What changed, and why this workflow is shorter than the one it replaces.
#
# site.zip used to be unzipped straight into _site and deployed. Those pages arrived nearly
# empty and assembled themselves in the visitor's browser from a React runtime, which meant
# anything that did not execute JavaScript saw unresolved {{ }} holes and no internal links.
# Four build steps existed purely to paper over that:
#
#   prerender.mjs        painted all 3,374 pages in headless Chrome and wrote back a text-only
#                        <noscript> fallback. ~6 minutes and a Puppeteer install per build.
#   faq-sync.mjs         forced the visible FAQ to match its schema, because the two rendered
#                        by different code paths and had drifted to 4-vs-6.
#   brand-normalize.mjs  folded 3,350 inline Organization nodes onto one @id.
#   brand-scrub.mjs      stripped phrases from generated copy.
#
# Pages now render on the server, complete, with their links and schema in the HTML. None of
# those four repairs has anything left to do. Puppeteer goes with them, so there is no npm
# install and no Chrome download in CI.
#
# site.zip is still the source of truth — for templates, content modules and assets. It just
# stops being the source of deployed HTML. Re-export it as often as you like; build/render/
# reads from it and the declared copy rewrites reapply on every build.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Unpacked to dist/, NOT _site. The zip supplies templates, data modules and assets;
      # the renderer decides what is deployed.
      - name: Unpack site.zip to dist/
        run: |
          set -e
          mkdir -p dist
          unzip -o -q site.zip -d dist
          if [ ! -f dist/index.html ]; then
            inner=$(find dist -maxdepth 2 -name index.html -print -quit)
            if [ -n "$inner" ]; then
              d=$(dirname "$inner")
              shopt -s dotglob
              mv "$d"/* dist/
            fi
          fi
          echo "dist file count: $(find dist -type f | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Renders every page, copies assets, applies the declared copy rewrites from
      # build/aeo-data.json, generates sitemap.xml from the pages that actually rendered,
      # then runs build/render/verify.mjs. No dependencies to install.
      - name: Render site
        run: node build/render/render.mjs --src dist --content content --out _site

      - name: Mark as non-Jekyll
        run: touch _site/.nojekyll

      # Repo-root files that win over anything the renderer produced. sitemap.xml is NOT in
      # this list any more: it is generated from the rendered pages, so a hand-maintained copy
      # could only ever be wrong. index.html is not here either — a repo-root index.html is
      # design-tool source, and overlaying it took the home page down on 2026-09-11 (ee31845).
      - name: Overlay repo-root files
        run: |
          set -e
          for f in robots.txt llms.txt CNAME; do
            [ -f "$f" ] && cp -v "$f" _site/"$f"
          done
          if [ -d overrides ]; then
            cp -rv overrides/. _site/
          fi
          if [ -f sitemap.xml ]; then
            echo "note: repo-root sitemap.xml is ignored — the deployed one is generated by render.mjs."
          fi

      # nap-block.mjs and social-links.mjs used to run here. Both injected markup after the
      # build because the footer was client-rendered, and both skipped the 3,032 pages that
      # had no footer at all. The footer is real markup on every page now, so those blocks
      # render with it and the two steps are gone. verify.mjs checks they are present.

      # Google silently discards a 404 in organization.logo.
      - name: Verify Organization logo resolves
        run: |
          set -e
          logo=$(node -e "process.stdout.write(require('./build/aeo-data.json').organization.logo || '')")
          if [ -z "$logo" ]; then echo "no organization.logo set - skipping"; exit 0; fi
          rel=$(echo "$logo" | sed -E 's#^https?://[^/]+/##')
          if [ ! -e "_site/$rel" ]; then
            echo "FAIL: organization.logo points at $logo but _site/$rel does not exist"
            echo "      add it at overrides/$rel so the overlay step ships it"
            exit 1
          fi
          echo "organization.logo resolves: $rel"

      # The final gate runs on the bytes that deploy, after the overlay and the two injection
      # steps have had their turn. Checks page count, template holes, every internal link and
      # asset reference, canonicals, JSON-LD validity, near-empty pages, and that every
      # indexable page is in the one sitemap.
      - name: Verify built site
        run: node build/render/verify.mjs --dir _site --min-pages 3300

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
