# Website chat relay for deepthought.marketing and factor42media.com. Deployed by .github/workflows/deploy-chat-worker.yml.
# The API key is a secret (ANTHROPIC_API_KEY), never in this file.
name = "deepthought-chat"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
SITE = "https://deepthought.marketing"
ALLOWED_ORIGINS = "https://deepthought.marketing,https://www.deepthought.marketing,https://factor42media.com,https://www.factor42media.com"
# Factor42 (factor42media.com) uses the same relay; the visitor's site picks the instructions.
F42_SITE = "https://factor42media.com"
# Factor42 chat leads are emailed here (comma-separate several). From must be a Resend-verified domain.
F42_LEADS_TO = "shajan@deepthought.marketing"
F42_LEADS_FROM = "Factor42 Website Chat <chat@deepthought.marketing>"
# Cheapest, fastest current model. Swap for claude-sonnet-5-5 if answers need more depth.
MODEL = "claude-haiku-4-5-20251001"
MAX_TOKENS = "600"
# Call-back details taken in the chat go to the same Apps Script as the website form (sheet + email).
LEADS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzi0ujRc26plP0yuO0CxXS43GAKB5Rw8NW4t3WaUsnuLvXnefTXmYxGZ7ZUOSjAPjoq/exec"
# Media plan builder (digital-media-plan-builder.html, 2026-10-15): the plan is emailed to the visitor from PLAN_FROM
# (Resend-verified domain), replies go to PLAN_REPLY_TO, and a copy goes to PLAN_NOTIFY_TO.
PLAN_FROM = "Deep Thought Marketing <plans@deepthought.marketing>"
PLAN_REPLY_TO = "shajan@deepthought.marketing"
PLAN_NOTIFY_TO = "shajan@deepthought.marketing"
# Claude connector (/mcp, 2026-10-25): media plans per day across all users. Each plan is two small Haiku calls.
MCP_DAILY_LIMIT = "200"
# Where "yes, set up my campaign" in the Claude connector sends people (2026-10-25). Swap for the exact sign-up page.
ADOPS_SIGNUP_URL = "https://deepthought.adops.rocks/"
# AdOps.rocks link (2026-11-03, src/adops.js). Turns on when the Worker secrets CONNECTOR_API_KEY and
# CONNECTOR_SHARED_SECRET are set (Cloudflare → Workers → deepthought-chat → Settings → Variables and Secrets).
ADOPS_API_BASE = "https://deepthought.adops.rocks/api/connector/"
ADOPS_CONNECT_URL = "https://deepthought.adops.rocks/connect/claude"
# What the connector tells people about review time for new campaigns and changes.
REVIEW_TARGET = "1 business day"
# Where Stripe returns people after saving a card from Claude (a "card saved, go back to Claude" page on this Worker).
CARD_RETURN_URL = "https://deepthought-chat.shajan.workers.dev/card-saved"
# ChatGPT plugin domain verification token (served at /.well-known/openai-apps-challenge). Paste the exact token
# from OpenAI's submission portal here and push. Empty = the path answers 404.
OPENAI_APPS_CHALLENGE = ""
# Glama directory ownership claim token (served at /.well-known/glama.json). Keep it published to stay verified.
GLAMA_CLAIM = "glama_claim_Zj8sE36DdZG1GIivLRDkeWolJPE2fiza"
# Daily chat digest: who it goes to, and who it's from. The "from" domain must be verified
# in Resend (resend.com → Domains). Comma-separate several recipients.
DIGEST_TO = "shajan@deepthought.marketing"
DIGEST_FROM = "DeepThought Chat <chat@deepthought.marketing>"

[observability]
enabled = true

# Chat log: one record per conversation, kept 90 days. The id is filled in by the deploy
# workflow (it creates the namespace "deepthought-chat-log" on first deploy).
[[kv_namespaces]]
binding = "CHAT_LOG"
id = "KV_ID_PLACEHOLDER"

# Daily digest at 12:00 UTC (8am New York in summer, 7am in winter).
[triggers]
crons = ["0 12 * * *"]
